<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Bloomly Lite</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>Bloomly Lite</h1>
    <nav>
      <button data-page="plants">Мои растения</button>
      <button data-page="add">Добавить растение</button>
      <button data-page="gallery">Галерея</button>
    </nav>
  </header>

  <main>
    <!-- Мои растения -->
    <section id="page-plants" class="page">
      <h2>Мои растения</h2>
      <input type="text" id="plant-search" placeholder="Поиск по растениям...">
      <div id="search-status"></div>
      <div id="plants-list"></div>
    </section>

    <!-- Добавить растение -->
    <section id="page-add" class="page" style="display:none;">
      <h2>Добавить растение</h2>
      <form id="add-plant-form">
        <label>Название:</label>
        <input id="plant-name" required />

        <label>Описание:</label>
        <textarea id="plant-description"></textarea>

        <label>Частота полива (дней):</label>
        <input id="plant-frequency" type="number" min="1" required />

        <button type="submit">Сохранить</button>
      </form>
    </section>

    <!-- Галерея -->
    <section id="page-gallery" class="page" style="display:none;">
      <h2>Галерея</h2>
      <input type="text" id="gallery-search" placeholder="Поиск по растениям...">
      <div id="gallery-search-status"></div>
      <input type="file" id="photo-input" accept="image/*" />
      <input type="text" id="photo-plant-name" placeholder="Название растения" />
      <button id="upload-photo-button">Добавить фото</button>
      <div id="gallery"></div>
      <h3>Сообщество растений (учебное демо)</h3>
      <div id="community-status"></div>
      <div id="community-gallery" class="gallery"></div>

    </section>
  </main>

  <!-- Детали -->
<section id="page-details" class="page" style="display:none;">
  <h2>Подробнее о растении</h2>
  <div id="details-content"></div>
  <button id="back-btn">Назад</button>
</section>

<div id="photo-modal" class="modal" style="display:none;">
  <span id="modal-close">&times;</span>
  <img id="modal-img" src="" alt="">
</div>


  <script src="plant.js"></script>
  <script type="module" src="./api.js"></script>
  <script type="module" src="./app.js"></script>
  <script src="app.js"></script>
</body>
</html>
